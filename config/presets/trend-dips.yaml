# Trend dips: only in an uptrend, buy the cycle's dips and let a trailing stop ride the trend.
extends: ../default
name: trend-dips
market: { interval: 1h, windowCandles: 512 }
entry:
  minStrength: 2
  trend: { minPctPerDay: 0.3 }
  phase: { from: 0.85, to: 0.25, requireRising: false }
  projection: { minSkill: 0.05, minHitRate: 0.5, minUpsidePct: 2, minRewardRisk: 1 }
exit:
  stopLossPct: 7
  trailingStopPct: 5
  atProjectedHigh: { enabled: false }
  onCycleTurn: false
  onStrengthBelow: null
  maxHoldCycles: 3
sizing: { mode: percent, percentOfBalance: 4 }
